name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Download deps
        uses: bahmutov/npm-install@v1
        with:
          useLockFile: false

      - name: 🔍 Validate
        run: npm run validate

  release:
    name: 🚀 Release
    needs: [validate]
    runs-on: ubuntu-latest
    # Cloudflare deploy is optional: steps below are skipped unless the
    # CLOUDFLARE_API_TOKEN and OAUTH_KV_ID repo secrets are configured
    # (local/ngrok-only deployments never set them).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OAUTH_KV_ID: ${{ secrets.OAUTH_KV_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Create deployment config
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.OAUTH_KV_ID != ''
        run: |
          cat > wrangler.deploy.jsonc << 'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "schwab-mcp",
            "main": "src/index.ts",
            "compatibility_date": "2025-04-17",
            "compatibility_flags": ["nodejs_compat"],
            "migrations": [
              {
                "new_sqlite_classes": ["MyMCP"],
                "tag": "v1"
              },
              {
                "new_sqlite_classes": ["ProposalStore"],
                "tag": "v2"
              }
            ],
            "durable_objects": {
              "bindings": [
                {
                  "class_name": "MyMCP",
                  "name": "MCP_OBJECT"
                },
                {
                  "class_name": "ProposalStore",
                  "name": "PROPOSAL_STORE"
                }
              ]
            },
            "kv_namespaces": [
              {
                "binding": "OAUTH_KV",
                "id": "${{ secrets.OAUTH_KV_ID }}"
              }
            ],
            "observability": {
              "enabled": true
            },
            "dev": {
              "port": 8788,
              "local_protocol": "http",
              "upstream_protocol": "https"
            }
          }
          EOF

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.OAUTH_KV_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler.deploy.jsonc
